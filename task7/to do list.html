<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: beige;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        li {
            margin: 20px 0;
        }

        .delete {
            background: brown;
            color: white;
            margin-left: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <input type="text" id="taskInput"
           placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

</div>

<script>

    function addTask() {

        let input = document.getElementById("taskInput");

        let task = input.value.trim();

        if (task === "") {
            alert("Please enter a task");
            return;
        }

        let li = document.createElement("li");

        li.textContent = task;

        let btn = document.createElement("button");

        btn.textContent = "Delete";

        btn.className = "delete";

        btn.onclick = function() {
            li.remove();
        };

        li.appendChild(btn);

        document.getElementById("taskList").appendChild(li);

        input.value = "";

    }

</script>

</body>
</html>
